_BASE_: "../configs/PascalVOC-Detection/faster_rcnn_R_50_FPN.yaml"
MODEL:
  META_ARCHITECTURE: "AMROD"
  ROI_HEADS:
    NUM_CLASSES: 8
  RESNETS:
    NORM: "FrozenBN"
INPUT:
  MIN_SIZE_TRAIN: (800, 832, 864, 896, 928, 960, 992, 1024)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048
DATASETS:
  TRAIN: ("Train",)
  TEST: ("defocus_blur", "glass_blur", "motion_blur", "zoom_blur", "snow", "frost", "fog", "brightness", "contrast", "elastic_transform", "pixelate", "jpeg_compression")

SOLVER:
  BASE_LR: 0.001
  WEIGHT_DECAY: 0.0001
  STEPS: (50000, )
  MAX_ITER: 70000
  IMS_PER_BATCH: 1
  WARMUP_ITERS: 0

  # AMROD hyperparameters (identical to cfg_cityscapes_c_short.yaml)
  CTAOD: TRUE
  MT: 0.9996
  RST_M: 0.001
  LOSS_WEIGHT: 1.0
  THRESHOLD_INIT: 0.80
  THRESHOLD_MAX: 0.90
  THRESHOLD_MINI: 0.70
  ALPHA_DT: 1.3
  GAMMA_DT: 0.95
  PROPOSALS: 200
  SCORE_EM: 0.5
  SCORE_GAMMA: 0.7
  SCORE_THRESH: 1.5

  # ---- TT-BBR (Test-Time Bounding Box Refinement) ----
  # Off by default in this config; the sweep enables it via CLI overrides
  # for phase-2 (composability-with-TT-BBR) runs.
  TTBBR_ENABLED: FALSE
  TTBBR_IOU_THRESH: 0.7
  TTBBR_DROP_INCONSISTENT: FALSE

  # ---- XAI-guided pseudo-label filter (Option 1) -- 2026-07-28 ----
  # Drops teacher boxes whose evidence is spatially diffuse. Three XAI
  # technique variants selected via SOLVER.XAI_METHOD.
  XAI_FILTER_ENABLED: TRUE
  XAI_METHOD: "eigencam"      # {eigencam, featnorm, gradcam}
  # NOTE: 7x7 pooled features on Cityscapes-C produce concentration in ~[0.02, 0.15]
  # (measured 2026-07-28). Threshold 0.30 drops all boxes; use <=0.05 for real data.
  XAI_THRESHOLD: 0.02          # concentration in [0,1]; higher => more aggressive
  XAI_MODE: "drop"             # {drop, reweight}

OUTPUT_DIR: ./output/res50_fbn_1x_xai
