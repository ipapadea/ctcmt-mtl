# E25 --- detection-only control on ACDC x10. The ACDC analogue of E15.
#
# Required to interpret E24. On Cityscapes-C the whole story rests on the
# det-only ceiling: E15 (26.80 AP50 / 35.51 mIoU) sits 2.00 / 4.68 above full
# MTL, which is what made the negative transfer measurable and what E22's
# routing recovered. ACDC has no equivalent measurement yet, so without this
# arm E24 is a number with nothing to be a fraction of.
#
# Three outcomes, all informative:
#   E25 > E11  -> ACDC has negative transfer too; E24 should close the gap
#   E25 ~ E11  -> no negative transfer on ACDC; E24 should be a no-op
#   E25 < E11  -> segmentation HELPS detection on ACDC, and routing should hurt
#
# ONE factor vs E11. CTCMT_DET_ONLY alone disables the seg loss, CT-CL, CT-CR
# and seg aug in forward(); the score-EMA gate is deliberately left as in E11.
_BASE_: "./ctcmt_e11_bothsc_ctcrD.yaml"

SOLVER:
  CTCMT_DET_ONLY: True

OUTPUT_DIR: "/workspace/output/ctta_acdc/e25_detonly_acdc"
