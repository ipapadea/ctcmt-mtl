  CTCMT_ADAPTIVE_STR_BASE: 0.1
  CTCMT_ADAPTIVE_STR_BOOST: 0.4
  CTCMT_ADAPTIVE_STR_PIVOT: 0.05

OUTPUT_DIR: "/workspace/output/ctcmt_e6_all"
