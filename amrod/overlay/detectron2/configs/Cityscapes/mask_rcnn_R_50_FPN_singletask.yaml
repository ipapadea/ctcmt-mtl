_BASE_: "../Base-RCNN-FPN.yaml"
MODEL:
  # Same backbone init and MASK_ON setting as our Panoptic FPN MTL model, so
  # this is architecturally "MTL model minus sem_seg head" = Mask R-CNN R-50 FPN.
  # With MASK_ON=False this reduces exactly to Faster R-CNN R-50 FPN.
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  MASK_ON: True
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NUM_CLASSES: 8

INPUT:
  # Matches Panoptic FPN MTL config for parity.
  MIN_SIZE_TRAIN: (800, 832, 864, 896, 928, 960, 992, 1024)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048

DATASETS:
  TRAIN: ("cityscapes_fine_instance_seg_train",)
  TEST: ("cityscapes_fine_instance_seg_val",)

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 4

SOLVER:
  # Identical schedule to Panoptic FPN MTL for controlled comparison.
  IMS_PER_BATCH: 4
  BASE_LR: 0.005
  STEPS: (36000,)
  MAX_ITER: 48000
  CHECKPOINT_PERIOD: 4000
  WARMUP_ITERS: 1000

TEST:
  EVAL_PERIOD: 4000

OUTPUT_DIR: "/workspace/output/mask_rcnn_R50_cityscapes"
