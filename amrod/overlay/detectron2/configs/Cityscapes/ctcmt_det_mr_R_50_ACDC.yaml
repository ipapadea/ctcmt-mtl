# CTCMT_Det on Mask R-CNN R-50 FPN source (single-task detection variant).
# Same CTCMT-MTL meta-arch but with CTCMT_DET_ONLY=True and student meta-arch
# switched to GeneralizedRCNN so all sem_seg_head accesses are gated off.
# V2 backbone-protected restore is ON to match the "AMROD + V2" baseline
# machinery — this row is our native single-task det competitor in Table 1.
_BASE_: "./mask_rcnn_R_50_FPN_singletask.yaml"

MODEL:
  META_ARCHITECTURE: "CTCMT_MTL"
  # Wrap a GeneralizedRCNN (Mask R-CNN) student, not the default PanopticFPN.
  CTCMT_STUDENT_META_ARCH: "GeneralizedRCNN"
  WEIGHTS: "/workspace/output/mask_rcnn_R50_cityscapes/model_final.pth"
  MASK_ON: True

DATASETS:
  TRAIN: ("cityscapes_fine_instance_seg_train",)
  # ACDC weather ordering matches AMROD / CTCMT-MTL (Cityscapes -> ACDC).
  TEST: ("acdc_fog", "acdc_night", "acdc_rain", "acdc_snow")

SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 0.001
  WEIGHT_DECAY: 0.0001
  STEPS: (50000,)
  MAX_ITER: 70000
  WARMUP_ITERS: 0

  # Mean-teacher + stochastic restore (CoTTA convention).
  MT: 0.9998
  RST_M: 0.01

  # Loss weights (only det branch is active).
  CTCMT_WEIGHT_DET: 1.0
  CTCMT_WEIGHT_SEG: 0.0
  CTCMT_WEIGHT_CTCL: 0.0
  CTCMT_WEIGHT_CTCR: 0.0

  # Dynamic-threshold pseudo-label filter (same as AMROD).
  THRESHOLD_INIT: 0.80
  THRESHOLD_MAX: 0.90
  THRESHOLD_MINI: 0.7
  ALPHA_DT: 1.3
  GAMMA_DT: 0.95
  SCORE_EM: 0.5
  SCORE_GAMMA: 0.7
  SCORE_THRESH: 1.4

  # Single-task det switches.
  CTCMT_DET_ONLY: True
  CTCMT_SEG_ONLY: False
  CTCMT_CTCL_ENABLED: False
  CTCMT_SEG_AUG_ENABLED: False

  # V2: task-aware stochastic restore (backbone protection).
  CTCMT_CROSS_TASK_FISHER: True
  CTCMT_BACKBONE_RST_FACTOR: 0.1

OUTPUT_DIR: "/workspace/output/ctcmt_det_mr_R50_C2ACDC"
