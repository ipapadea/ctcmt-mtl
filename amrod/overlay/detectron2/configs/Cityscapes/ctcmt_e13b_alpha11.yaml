# E13b — lower ALPHA_DT, 1.3 -> 1.1.
#
# Same target as E13a but moves the threshold fixed point instead of clipping it:
# tau* = alpha*sqrt(mean_score). With mean_score ~0.7, alpha=1.3 gives 1.09
# (above the ceiling) whereas alpha=1.1 gives 0.92, so the rule stays responsive
# to teacher confidence rather than sitting on the clip.
_BASE_: "./ctcmt_e11_bothsc_ctcrD.yaml"

SOLVER:
  ALPHA_DT: 1.1

OUTPUT_DIR: "/workspace/output/ctta_acdc/e13b_alpha11"
