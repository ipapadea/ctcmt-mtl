_BASE_: "../Base-RCNN-FPN.yaml"
MODEL:
  # Semantic FPN: same FPN backbone + PanopticFPN-style sem_seg head, no RPN/ROI.
  # Architecturally "MTL model minus box/mask heads".
  META_ARCHITECTURE: "SemanticSegmentor"
  # Same init as the Panoptic FPN MTL config for parity.
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
  SEM_SEG_HEAD:
    NUM_CLASSES: 19
    IGNORE_VALUE: 255
    LOSS_WEIGHT: 1.0

INPUT:
  MIN_SIZE_TRAIN: (800, 832, 864, 896, 928, 960, 992, 1024)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048

DATASETS:
  TRAIN: ("cityscapes_fine_sem_seg_train",)
  TEST: ("cityscapes_fine_sem_seg_val",)

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 4

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.005
  STEPS: (36000,)
  MAX_ITER: 48000
  CHECKPOINT_PERIOD: 4000
  WARMUP_ITERS: 1000

TEST:
  EVAL_PERIOD: 4000

OUTPUT_DIR: "/workspace/output/semantic_R50_cityscapes"
